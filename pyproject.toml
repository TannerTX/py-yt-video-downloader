[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-yt-video-downloader"
version = "0.1.0"
description = "A simple, friendly YouTube MP4/MP3 downloader CLI powered by yt-dlp."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "py-yt-video-downloader contributors" }
]
keywords = ["youtube", "download", "yt-dlp", "mp4", "mp3", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
py-yt-video-downloader = "py_yt_video_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["py_yt_video_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
